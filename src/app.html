<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover draws under the notch and home indicator; pages pad
         their content back with env(safe-area-inset-*). resizes-content makes
         Android's keyboard shrink the page the way iOS's does. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- Status bar color, matching --background. The script sets it. -->
    <meta name="theme-color" content="#ffffff" />
    <!-- Runs before the page draws, so it never shows the wrong theme first.
         Plain JavaScript repeating applyTheme in src/lib/theme.svelte.ts;
         theme.svelte.spec.ts checks they agree. -->
    <script>
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem("theme");
        } catch (error) {
          // Storage blocked: follow the device.
        }
        var dark =
          choice === "dark" ||
          (choice !== "light" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#0a0a0a"
          : "#ffffff";
      })();
    </script>
    <meta name="text-scale" content="scale" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
    <!-- Puts a reloaded page back where it was scrolled before it first
         paints. Kit restores the position too, but only after its JavaScript
         loads, so the page would draw at the top first and then jump. This
         runs as soon as the page's HTML and CSS are in, after the content
         above and before Kit's code, which then finds it already in place.
         Plain JavaScript and web APIs only: nothing here depends on Kit. -->
    <script>
      (function () {
        var key = "scroll-before-leaving";
        try {
          var saved = JSON.parse(sessionStorage.getItem(key) || "null");
          var navigation = performance.getEntriesByType("navigation")[0];
          // Only the same page coming back: a reload, or Back or Forward
          // from another site when the browser didn't keep the page in memory.
          if (
            saved &&
            saved.href === location.href &&
            navigation &&
            (navigation.type === "reload" || navigation.type === "back_forward")
          ) {
            scrollTo(saved.x, saved.y);
          }
        } catch (error) {
          // Storage blocked: Kit restores the position once it loads.
        }
        // pagehide is the one event every browser fires when a page is left,
        // including iOS Safari, which skips beforeunload.
        addEventListener("pagehide", function () {
          try {
            sessionStorage.setItem(
              key,
              JSON.stringify({ href: location.href, x: scrollX, y: scrollY })
            );
          } catch (error) {
            // Storage blocked: nothing to restore next time.
          }
        });
      })();
    </script>
  </body>
</html>

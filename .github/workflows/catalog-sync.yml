# Loads and refreshes the movie catalog from TMDB (spec section 2), in Production.
# Runs every 2 days and on demand (Actions → Catalog sync → Run workflow).
# The sync is safe to re-run; an interrupted run resumes where it stopped.
name: Catalog sync

on:
  schedule:
    # 09:23 UTC on odd days of the month. GitHub may start it late, and it
    # switches schedules off after 60 days without repository activity:
    # Healthchecks emails when a run doesn't arrive.
    - cron: "23 9 */2 * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "Fail on purpose, to test the alert"
        type: boolean
        default: false

permissions:
  contents: read

# Never two runs at once (the script also holds a database lock).
concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
      # Linked from the alert email.
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Tell Healthchecks the run started
        run: curl -fsS -m 10 --retry 3 --data-raw "$RUN_URL" "$HEALTHCHECKS_PING_URL/start"

      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Fail on purpose
        if: inputs.force_failure
        run: |
          echo "Failing on purpose to test the alert."
          exit 1

      - name: Sync the catalog
        run: bun run catalog:sync
        env:
          # The catalog_sync role's direct (not pooled) Production URL: it can
          # only write movies, genres, and movie_genres.
          DATABASE_URL_UNPOOLED: ${{ secrets.CATALOG_SYNC_DATABASE_URL }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}

      - name: Tell Healthchecks the run succeeded
        if: success()
        run: curl -fsS -m 10 --retry 3 --data-raw "$RUN_URL" "$HEALTHCHECKS_PING_URL"

      - name: Tell Healthchecks the run failed
        if: failure() || cancelled()
        run: curl -fsS -m 10 --retry 3 --data-raw "$RUN_URL" "$HEALTHCHECKS_PING_URL/fail"
